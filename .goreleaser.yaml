# goreleaser v2 configuration. Run `goreleaser check` to validate.
version: 2

project_name: lazyleet

before:
  hooks:
    - go mod tidy

builds:
  - id: lazyleet
    main: ./cmd/lazyleet
    binary: lazyleet
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

brews:
  - name: lazyleet
    repository:
      owner: sven97
      name: homebrew-tap
      # A fine-grained PAT scoped to just homebrew-tap (Contents: Read &
      # Write) — the default GITHUB_TOKEN in Actions can't reach a different
      # repo. Locally, falls back to GITHUB_TOKEN (your own `gh` login,
      # which can already push anywhere you own) when the env var is unset.
      token: "{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}{{ else }}{{ .Env.GITHUB_TOKEN }}{{ end }}"
    directory: Formula
    homepage: "https://github.com/sven97/lazyleet"
    description: "Practice LeetCode in the terminal, in your own editor"
    license: "MIT"
    install: |
      bin.install "lazyleet"
    test: |
      system "#{bin}/lazyleet", "--version"

release:
  github:
    owner: sven97
    name: lazyleet

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
