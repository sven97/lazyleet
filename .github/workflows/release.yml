name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Creates the GitHub release on this repo — the default token is
          # scoped to it and that's all it's used for here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the updated formula to sven97/homebrew-tap, a different
          # repo the default token above can't reach. Fine-grained PAT,
          # Contents: Read & Write, scoped to just homebrew-tap — see
          # notes/RELEASE.md.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
